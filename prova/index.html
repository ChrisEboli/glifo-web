<!DOCTYPE html>
<html lang="it">
<head>
  <base href="/glifo-web/prova/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Glifo: le anamnesi dei clienti, a portata di trainer.">
  <!-- Non va nei motori di ricerca: è uno strumento interno del centro. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#123B33">

  <!-- iPhone: "Aggiungi a Home" la apre a schermo intero con la sua icona -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Glifo">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Glifo</title>
  <link rel="manifest" href="manifest.json">
  <style>html,body{background:#123B33;margin:0}</style>
</head>
<body>
  <script>
    // iPhone, app aperta dalla schermata Home: a volte all'avvio Safari dà a Glifo una misura
    // dello schermo sbagliata e i tocchi non arrivano finché non si gira il telefono (che fa
    // ricalcolare la misura). Qui si chiede lo stesso ricalcolo da soli, dopo l'avvio e ogni
    // volta che si torna sull'app.
    (function () {
      function remeasure() {
        // Flutter ascolta il "resize" di visualViewport quando c'è (Safari), altrimenti della finestra.
        (window.visualViewport || window).dispatchEvent(new Event('resize'));
      }
      function soon() { [300, 1000, 2500].forEach(function (ms) { setTimeout(remeasure, ms); }); }
      soon();
      window.addEventListener('flutter-first-frame', soon);
      window.addEventListener('pageshow', soon);
      document.addEventListener('visibilitychange', function () { if (!document.hidden) soon(); });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
